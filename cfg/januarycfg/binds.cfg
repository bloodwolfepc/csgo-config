//basic binds
bind mwheelup +jump
bind mwheeldown +jump
bind scancode29 slot3 //z

bind scancode47 "volume 0.1" //bracket left
bind scancode48 "volume 0.5" //bracket right

alias "r" "exec autoexec.cfg"
alias "clearparticles" "ent_fire; smokegrenade_projectile kill; ent_fire molotov_projectile kill; ent_fire flashbang_projectile kill; ent_fire hegrenade_projectile kill; ent_fire decoy_projectile kill; stopsound"
alias "practice" "bot_kick; mp_warmup_end; sv_cheats 1; mp_limitteams 0; mp_autoteambalance 0; mp_maxmoney 60000; mp_startmoney 60000; mp_buytime 9999; mp_buy_anywhere 1; mp_freezetime 0; mp_roundtime 60; mp_roundtime_defuse 60; mp_respawn_on_death_ct 1; mp_respawn_on_death_t 1; sv_infinite_ammo 1; sv_showimpacts 1; sv_showimpacts_time 10; ammo_grenade_limit_total 5; sv_grenade_trajectory_prac_pipreview 1; mp_restartgame 1; sv_regeneration_force_on 1"

bind scancode45 sv_rethrow_last_grenade //minuis
bind scancode46 "clearparticles" //plus
bind scancode38 "practice" //0



//shift+e=zoom
//alt+f=noclip

//<key, layer, escape binding>
//escape bindings are only needed if a release command is initiated from inside a layer

//mainlayer binds
alias q0 "bind scancode20 slot6" //he
alias 40 "bind scancode33 slot7" //flash
alias 90 "bind scancode38 slot9" //decoy
alias x0 "bind scancode27 slot10" //molly
alias c0 "bind scancode6 slot8" //smoke
q0; 40; x0; 90; c0

alias r0 "bind scancode21 +reload"
r0

//alias f0 "bind scancode9 toggleradarscale"
alias f0 "bind scancode9 +lookatweapon"
alias f0e "-lookatweapon"
f0; f0e

alias layer0 "f0; x0; c0; q0; r0; 40; 90"

//alt layer binds
alias setf1 +lookatweapon
alias f1 "bind scancode9 setf1"
alias +layer1 "f1; f0e"
alias -layer1 "layer0"

//space (buy) layer binds
alias setq2 "buy hegrenade; slot3"
alias q2 "bind scancode20 setq2"

alias set42 "buy flashbang; slot3"
alias 42 "bind scancode33 set42"

alias set92 "buy decoygrenade; slot3"
alias 92 "bind scancode38 set90"

alias setx2 "buy smokegrenade; slot3"
alias x2 "bind scancode27 setx0"

alias setc2 "buy incgrenade; slot3"
alias c2 "bind scancode6 setc0"

alias setr2 sellbackall
alias r2 "bind scancode21 setr2"
alias +layer2 "q2; r2; q2; 42; x2; 90; c2"
alias -layer2 "layer0"

bind scancode226 +layer1 //alt
bind scancode44 +layer2 //space
bind scancode225 +sprint //shift
