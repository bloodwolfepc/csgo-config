// Global Layer Maps
// Basic Action
bind mouse1 +attack // [mouse1]
bind mouse2 +attack2 // [mouse2]

// Movement
bind scancode4 +left // [a]
bind scancode7 +right // [d]
bind scancode22 +back // [s]
bind scancode26 +forward // [w]
bind mouse_x yaw
bind mouse_y pitch
bind x_axis rightleft
bind y_axis !forwardback
bind u_axis yaw
bind r_axis pitch
bind mwheeldown +jump
bind scancode225 +sprint // [lshift]
bind scancode224 +duck // [ctrl]
bind scancode82 +forward // [uparrow]
bind scancode81 +back // [downarrow]
bind scancode80 +turnleft // [leftarrow]
bind scancode79 +turnright // [rightarrow]

// UI/Radio
bind mwheelup player_ping
bind scancode53 toggleconsole // [`]

// Function maps
bind scancode60 autobuy // [f3]
bind scancode61 afk-move // [f4]
bind scancode62 clutch_mode_toggle; select // [f5] 
bind scancode63 mute-enemy-team // [f6]
bind scancode64 ignore-messages // [f7]
bind scancode65 ignore-radio // [f8]
bind scancode66 fixer // [f9]

// Mainlayer Maps
// Basic Action
alias "r0" "bind scancode21 +reload" // [r]
alias "e0" "bind scancode8 +use" // [e]
alias "g0" "bind scancode10 drop" // [g]
alias "f0" "bind scancode9 +lookatweapon" // [f]
alias basic0 "r0; e0; g0; j0; f0"


// Slots
alias 10 bind scancode30 slot1 // [1] 
alias 20 bind scancode31 slot2 // [2] 
alias z0 bind scancode29 slot3 // [z] knife
alias 50 bind scancode34 slot5 // [5] C4 / med-shot
alias q0 bind scancode20 slot6 // [q] HE / showball
alias 40 bind scancode33 slot7 // [4] flash
alias c0 bind scancode6 slot8 // [c] smoke
alias 60 bind scancode35 slot9 // [6] decoy
alias x0 bind scancode27 slot10 // [x] molly
alias backspace0 bind scancode46 slot12 // [backspace] Medi-Shot
alias slots0 "10; 20; z0; 50; q0; 40; c0; 60; x0; backspace0"

// UI/Radio
alias v0 bind scancode25 +voicerecord
alias y0 bind scancode24 messagemode2 // [y] Team messages
alias u0 bind scancode28 messagemode // [u] All Message
alias tab0 bind scancode43 toggleradarscale // [tab]
alias b0 bind scancode5 buymenu // [b]
alias k0 bind scancode14 callvote // [k]
alias m0 bind scancode16 teammenu // [m]
alias t0 bind scancode23 +spray_menu // [t]
alias p0 bind scancode19 toggle spec_show_xray // [p]
alias h0 bind scancode11 +showscores // [h]
alias esc0 bind scancode41 cancelselect // [esc]
alias period0 bind scancode55 exec autoexec.cfg // [.]
alias fwslash0 bind scancode56 toggleconsole // [/]
alias UI0 "v0; y0; u0; tab0; b0; k0; m0; t0; p0; h0; esc0; period0; fwslash0"

// Audio
alias lbracket0 "bind scancode47 volume 0" // ([)
alias rbracket0 "bind scancode48 volume 0.1" // (])
alias bslash0 bind scancode49 exec januarycfg/audio.cfg // [\]
alias audio0 "lbracket0; rbracket0; bslash0"

//unbinds (needed where a layer over 0 will set a map), ideally an alias that unbinds all nonglobals
//alias u40 unbind

// Access Layers
bind scancode226 +layer1 // [alt]
bind mouse5 +layer1
bind scancode44 +layer2 // [space]
bind mouse4 +layer2

alias +layer0 "basic0; special0; slots0; UI0; audio0"
+layer0

